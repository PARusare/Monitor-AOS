<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reporte de registro - Monitor AOS</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, sans-serif;
    background: #0d0f14; color: #eee;
    padding: 20px 14px 60px;
  }

  .top { display: flex; align-items: center; margin-bottom: 18px; }
  .volver { color: #999; text-decoration: none; font-size: 15px; margin-right: 12px; }
  .top h1 { font-size: 17px; font-weight: 600; color: #fff; }

  .controles { display: flex; gap: 10px; margin-bottom: 14px; }
  .btn {
    flex: 1; padding: 13px 10px; border-radius: 12px; border: none;
    font-size: 14px; font-weight: 600; font-family: inherit;
    -webkit-tap-highlight-color: rgba(255,255,255,0.15);
  }
  .btn-principal { background: #22c55e; color: #06210f; }
  .btn-secundario { background: #262a33; color: #ccc; }
  .ayuda { font-size: 12px; color: #777; margin-bottom: 18px; line-height: 1.5; }

  /* ---------- la hoja ---------- */
  .hoja {
    background: #fff; color: #111; border-radius: 6px; padding: 26px 22px;
    font-family: Arial, Helvetica, sans-serif; font-size: 12px; line-height: 1.45;
  }

  .enc { text-align: center; border-bottom: 2px solid #111; padding-bottom: 7px; }
  .enc .institucion { font-size: 9.5px; letter-spacing: 0.4px; text-transform: uppercase; color: #333; }
  .enc h2 { font-size: 13px; font-weight: 700; letter-spacing: 0.3px; margin: 5px 0 3px; }
  .enc .estudio { font-size: 10.5px; }

  .ficha { width: 100%; border-collapse: collapse; font-size: 11.5px; margin: 10px 0 14px; }
  .ficha td { padding: 2px 0; vertical-align: top; }
  .ficha td.etq { color: #333; white-space: nowrap; padding-right: 6px; width: 15%; }
  .ficha td.val { font-weight: 700; padding-right: 16px; width: 35%; }
  .ficha td.val input, .ficha td.val select {
    font-family: inherit; font-size: 11.5px; font-weight: 700;
    border: none; border-bottom: 1px solid #888; background: transparent;
    color: #111; padding: 0 1px; width: 100%; min-width: 0;
  }
  .ficha td.val input:focus, .ficha td.val select:focus { outline: none; border-bottom-color: #111; }

  h3.ap {
    font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.7px;
    border-bottom: 1px solid #111; padding-bottom: 2px; margin: 0 0 7px;
  }
  .bloque { margin-bottom: 14px; }

  table.tabla { width: 100%; border-collapse: collapse; font-size: 11px; }
  table.tabla th {
    text-align: left; font-weight: 700; padding: 4px 5px;
    border-top: 1px solid #111; border-bottom: 1px solid #111; background: #f2f2f2;
  }
  table.tabla td { padding: 3.5px 5px; border-bottom: 1px solid #ccc; }
  table.tabla td.num, table.tabla th.num { text-align: right; }
  table.tabla tr.sin td { color: #777; font-style: italic; }
  table.tabla tfoot td { font-weight: 700; border-top: 1px solid #111; border-bottom: 1px solid #111; }

  .resultado {
    border: 1px solid #111; padding: 10px 12px; margin-bottom: 6px;
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
  }
  .resultado .izq .n { font-size: 26px; font-weight: 700; line-height: 1; }
  .resultado .izq .e { font-size: 9.5px; text-transform: uppercase; letter-spacing: 0.4px; color: #333; margin-top: 3px; }
  .resultado .der { text-align: right; font-size: 11px; }
  .resultado .der .grado { font-size: 15px; font-weight: 700; }
  .cortes { font-size: 9.5px; color: #333; margin-bottom: 12px; }

  .g-row { display: flex; align-items: center; font-size: 10.5px; margin-bottom: 2px; }
  .g-et { width: 42px; color: #333; flex-shrink: 0; }
  .g-track { flex: 1; border: 1px solid #bbb; height: 9px; margin: 0 6px; }
  .g-fill { height: 100%; background: #555; }
  .g-num { width: 26px; text-align: right; }

  .pie-doc {
    margin-top: 12px; border-top: 1px solid #111; padding-top: 6px;
    font-size: 9px; color: #333; text-align: justify; line-height: 1.4;
  }
  .pie-doc b { color: #111; }
  #cargando { text-align: center; color: #888; padding: 40px 0; line-height: 1.6; }

  /* ---------- impresion ---------- */
  @page { size: letter; margin: 18mm 16mm; }
  @media print {
    body { background: #fff; color: #000; padding: 0; }
    .top, .controles, .ayuda { display: none !important; }
    .hoja { border-radius: 0; padding: 0; font-size: 10pt; }
    table.tabla, .resultado, .grafica, .ficha { page-break-inside: avoid; }
    h3.ap { page-break-after: avoid; }
    .pie-doc { font-size: 7.5pt; }
    .ficha td.val input, .ficha td.val select {
      border-bottom: none; appearance: none; -webkit-appearance: none; padding-left: 0;
    }
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
</style>
</head>
<body>

  <div class="top">
    <a class="volver" href="index.html">&larr;</a>
    <h1 id="tituloPagina">Reporte del periodo</h1>
  </div>

  <div class="controles">
    <button class="btn btn-secundario" onclick="window.location.href='index.html'">Calendario</button>
    <button class="btn btn-principal" onclick="window.print()">Guardar como PDF</button>
  </div>
  <div class="ayuda">Completa los datos de la persona antes de guardar. El botón abre el diálogo de
    impresión del teléfono, donde se elige Guardar como PDF.</div>

  <div id="cargando">Reuniendo las noches del periodo...</div>
  <div class="hoja" id="hoja" style="display:none"></div>

<script>
  const TOKEN = "Y1l8ur86hHTcYlxXcNSJxuVsJEt1VsUO";
  const SERVIDOR = "ny3.blynk.cloud";
  const GH_USUARIO = "PARusare";
  const GH_REPO = "Monitor-AOS";

  const NOCHES_MINIMAS = 3;
  const HORAS_MINIMAS = 4;        // adecuacion tecnica de una noche, criterio AASM
  const EVENTO_LARGO = 20;        // segundos, para el conteo de eventos prolongados

  const CORTES = [
    { desde: 30, nombre: "Severo" },
    { desde: 15, nombre: "Moderado" },
    { desde:  5, nombre: "Leve" },
    { desde:  0, nombre: "Normal" },
  ];

  const params = new URLSearchParams(window.location.search);
  const inicio = params.get("inicio");
  const fin = params.get("fin");

  const DIAS = ["dom","lun","mar","mié","jue","vie","sáb"];
  const MESES = ["enero","febrero","marzo","abril","mayo","junio","julio",
                 "agosto","septiembre","octubre","noviembre","diciembre"];

  function aNumero(iso) { return parseInt(iso.replace(/-/g, ""), 10); }
  function sumarDias(iso, d) {
    const [a, m, dd] = iso.split("-").map(Number);
    return new Date(Date.UTC(a, m - 1, dd + d)).toISOString().slice(0, 10);
  }
  function diaSemana(iso) {
    const [a, m, d] = iso.split("-").map(Number);
    return DIAS[new Date(Date.UTC(a, m - 1, d)).getUTCDay()];
  }
  function fechaLarga(iso) {
    const [a, m, d] = iso.split("-").map(Number);
    return `${d} de ${MESES[m - 1]} de ${a}`;
  }
  function fechaCorta(iso) { const [, m, d] = iso.split("-"); return `${d}/${m}`; }
  function horaMexico(f) { return f.toLocaleTimeString("es-MX", { timeZone: "America/Mexico_City" }); }
  function hoyMexicoISO() {
    const p = new Intl.DateTimeFormat("en-CA", { timeZone: "America/Mexico_City",
      year: "numeric", month: "2-digit", day: "2-digit" }).formatToParts(new Date());
    const o = {}; p.forEach(x => o[x.type] = x.value);
    return `${o.year}-${o.month}-${o.day}`;
  }
  function clasificar(i) { return CORTES.find(c => i >= c.desde).nombre; }
  function escapar(s) { return String(s || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;"); }

  // ---------- datos de la persona, guardados en el propio telefono ----------
  const CLAVE = "monitorAOS.persona";
  function leerPersona() {
    try { return JSON.parse(localStorage.getItem(CLAVE)) || {}; } catch (e) { return {}; }
  }
  function guardarPersona() {
    const p = { nombre: document.getElementById("pNombre").value,
                edad: document.getElementById("pEdad").value,
                sexo: document.getElementById("pSexo").value };
    try { localStorage.setItem(CLAVE, JSON.stringify(p)); } catch (e) {}
  }

  // ---------- lectura de las noches ----------
  async function cargarNoche(fecha, datosBlynk) {
    if (datosBlynk && datosBlynk.v10 === fecha) return datosBlynk;
    try {
      const url = `https://raw.githubusercontent.com/${GH_USUARIO}/${GH_REPO}/main/reportes/${fecha}.json?t=${Date.now()}`;
      const resp = await fetch(url, { cache: "no-store" });
      if (resp.ok) return await resp.json();
    } catch (e) { /* la noche queda sin registro */ }
    return null;
  }

  function numero(v) { const n = parseFloat(v); return isNaN(n) ? null : n; }

  function resumirNoche(fecha, datos) {
    if (!datos) return { fecha, hay: false };
    const conteo = (datos.v9 || "").split("-").map(n => parseInt(n) || 0);
    const eventos = conteo.reduce((a, b) => a + b, 0);
    const indice = numero(datos.v6) ?? 0;
    const horas = numero(datos.v4) ?? 0;
    return {
      fecha, hay: true, eventos, indice, horas, conteo,
      duracion: numero(datos.v5) ?? 0,
      maxima: numero(datos.v13),      // puede faltar en registros anteriores a v17
      largos: numero(datos.v14),
      grado: clasificar(indice),
      adecuada: horas >= HORAS_MINIMAS,
    };
  }

  // Reparto por hora de todo el periodo, ordenado desde la hora en que
  // habitualmente empezo el registro, para que la noche se lea completa.
  function repartoPeriodo(noches) {
    const suma = new Array(24).fill(0);
    noches.filter(n => n.hay).forEach(n => n.conteo.forEach((v, h) => suma[h] += v));
    let mejorInicio = 0, mejorLargo = -1, largo = 0, ini = 0;
    for (let i = 0; i < 48; i++) {
      const h = i % 24;
      if (suma[h] === 0) {
        if (largo === 0) ini = i;
        largo++;
        if (largo > mejorLargo && largo <= 24) { mejorLargo = largo; mejorInicio = (ini + largo) % 24; }
      } else largo = 0;
    }
    const maximo = Math.max(1, ...suma);
    const filas = [];
    for (let i = 0; i < 24; i++) {
      const h = (mejorInicio + i) % 24;
      if (suma[h] === 0) continue;
      filas.push({ hora: h, n: suma[h], pct: (suma[h] / maximo) * 100 });
    }
    return filas;
  }

  function folio(iso) {
    const c = s => s.replace(/-/g, "");
    return `MAOS-${c(inicio)}-${c(fin)}-${c(iso)}`;
  }

  function armar(r) {
    const emision = new Date();
    const emisionISO = hoyMexicoISO();
    const persona = leerPersona();
    const hayMax = r.noches.some(n => n.hay && n.maxima !== null);

    const col = hayMax ? 7 : 5;
    const filas = r.noches.map(n => {
      if (!n.hay) {
        return `<tr class="sin"><td>${fechaCorta(n.fecha)}</td><td>${diaSemana(n.fecha)}</td>
          <td colspan="${col - 2}">sin registro</td></tr>`;
      }
      const extra = hayMax
        ? `<td class="num">${n.maxima !== null ? n.maxima : "--"}</td>
           <td class="num">${n.largos !== null ? n.largos : "--"}</td>` : "";
      return `<tr>
        <td>${fechaCorta(n.fecha)}</td>
        <td>${diaSemana(n.fecha)}</td>
        <td class="num">${n.horas.toFixed(2)}</td>
        <td class="num">${n.eventos}</td>
        <td class="num">${n.indice.toFixed(2)}</td>
        <td class="num">${n.duracion.toFixed(1)}</td>
        ${extra}
      </tr>`;
    }).join("");

    const cabExtra = hayMax
      ? `<th class="num">Duración máxima (s)</th><th class="num">Eventos &ge; ${EVENTO_LARGO} s</th>` : "";
    const pieExtra = hayMax
      ? `<td class="num">${r.maximaPeriodo !== null ? r.maximaPeriodo : "--"}</td>
         <td class="num">${r.largosTotales !== null ? r.largosTotales : "--"}</td>` : "";

    const filasHora = r.reparto.map(f => `
      <div class="g-row">
        <div class="g-et">${String(f.hora).padStart(2,"0")}:00</div>
        <div class="g-track"><div class="g-fill" style="width:${f.pct}%"></div></div>
        <div class="g-num">${f.n}</div>
      </div>`).join("");

    document.getElementById("hoja").innerHTML = `
      <div class="enc">
        <div class="institucion">Instituto Politécnico Nacional &middot; ESIME Unidad Culhuacán<br>
          Ingeniería en Comunicaciones y Electrónica</div>
        <h2>REPORTE DE REGISTRO RESPIRATORIO DURANTE EL SUEÑO</h2>
        <div class="estudio">Poligrafía respiratoria domiciliaria de un canal, flujo respiratorio indirecto
          &middot; ${r.conRegistro} ${r.conRegistro === 1 ? "noche" : "noches"} de registro
          &middot; Sistema Monitor AOS</div>
      </div>

      <table class="ficha">
        <tr>
          <td class="etq">Nombre</td>
          <td class="val" colspan="3"><input id="pNombre" value="${escapar(persona.nombre)}" placeholder="escribir"></td>
        </tr>
        <tr>
          <td class="etq">Edad</td><td class="val"><input id="pEdad" value="${escapar(persona.edad)}" placeholder="años"></td>
          <td class="etq">Sexo</td><td class="val">
            <select id="pSexo">
              <option value=""></option>
              <option value="Hombre">Hombre</option>
              <option value="Mujer">Mujer</option>
              <option value="Prefiere no decirlo">Prefiere no decirlo</option>
            </select></td>
        </tr>
        <tr>
          <td class="etq">Periodo</td><td class="val">${fechaLarga(inicio)} al ${fechaLarga(fin)}</td>
          <td class="etq">Emitido</td><td class="val">${fechaLarga(emisionISO)}, ${horaMexico(emision)}</td>
        </tr>
        <tr>
          <td class="etq">Folio</td><td class="val" colspan="3">${folio(emisionISO)}</td>
        </tr>
      </table>

      <div class="bloque">
        <h3 class="ap">Resultado</h3>
        <div class="resultado">
          <div class="izq">
            <div class="n">${r.indicePromedio.toFixed(1)}</div>
            <div class="e">índice de eventos respiratorios, por hora</div>
          </div>
          <div class="der">
            <div class="grado">${r.gradoPromedio}</div>
            <div>promedio de ${r.conRegistro} noches<br>
              variación entre noches: ${r.indiceMin.toFixed(1)} a ${r.indiceMax.toFixed(1)}</div>
          </div>
        </div>
        <div class="cortes">Cortes de la American Academy of Sleep Medicine: menor a 5 normal,
          de 5 a 15 leve, de 15 a 30 moderado, 30 o más severo.</div>
      </div>

      <div class="bloque">
        <h3 class="ap">Registro por noche</h3>
        <table class="tabla">
          <thead><tr>
            <th>Fecha</th><th>Día</th>
            <th class="num">Registro (h)</th>
            <th class="num">Eventos</th>
            <th class="num">Índice (ev/h)</th>
            <th class="num">Duración media (s)</th>
            ${cabExtra}
          </tr></thead>
          <tbody>${filas}</tbody>
          <tfoot><tr>
            <td colspan="2">Periodo</td>
            <td class="num">${r.horasTotales.toFixed(2)}</td>
            <td class="num">${r.eventosTotales}</td>
            <td class="num">${r.indicePromedio.toFixed(2)}</td>
            <td class="num">${r.duracionPromedio.toFixed(1)}</td>
            ${pieExtra}
          </tr></tfoot>
        </table>
      </div>

      <div class="bloque grafica">
        <h3 class="ap">Distribución de los eventos por hora del día</h3>
        ${filasHora}
      </div>

      <div class="pie-doc">
        <b>Método.</b> El flujo respiratorio se registra de forma indirecta mediante un sensor de temperatura y
        humedad SHT30 colocado en una mascarilla nasal, con dos lecturas por segundo. Se considera un evento la
        interrupción del flujo mayor a diez segundos, criterio de la American Academy of Sleep Medicine,
        identificada por la ausencia de variación entre lecturas consecutivas con umbrales de 0.15 °C y 0.5 % de
        humedad relativa, determinados experimentalmente en este proyecto. Se registran como válidos los eventos
        de 7 a 40 segundos. El índice de cada noche es el número de eventos entre sus horas de registro, y el del
        periodo es el promedio de los índices por noche. El tiempo de registro corresponde al tiempo de sesión del
        equipo. Las noches se consideran técnicamente adecuadas a partir de ${HORAS_MINIMAS} horas de registro, y
        el periodo de entre ${NOCHES_MINIMAS} y 14 noches sigue la guía de la misma academia para registros
        domiciliarios de varios días.
        <b>Este documento es informativo, no constituye un diagnóstico, no sustituye una valoración médica ni una
        polisomnografía, lo genera de forma automática el equipo sin intervención de un profesional de la salud y
        no lleva firma.</b> Su propósito es poner los datos registrados a disposición de un médico.
      </div>
    `;

    document.getElementById("pSexo").value = persona.sexo || "";
    ["pNombre", "pEdad", "pSexo"].forEach(id =>
      document.getElementById(id).addEventListener("change", guardarPersona));
    document.getElementById("cargando").style.display = "none";
    document.getElementById("hoja").style.display = "";
    document.getElementById("tituloPagina").innerText = `${fechaCorta(inicio)} al ${fechaCorta(fin)}`;
  }

  (async () => {
    if (!inicio || !fin) {
      document.getElementById("cargando").innerText = "Falta indicar el periodo del reporte.";
      return;
    }

    let datosBlynk = null;
    try {
      const resp = await fetch(`https://${SERVIDOR}/external/api/getAll?token=${TOKEN}`);
      if (resp.ok) datosBlynk = await resp.json();
    } catch (e) { /* se trabaja solo con lo guardado */ }

    const fechas = [];
    for (let f = inicio; aNumero(f) <= aNumero(fin); f = sumarDias(f, 1)) fechas.push(f);

    const crudas = await Promise.all(fechas.map(f => cargarNoche(f, datosBlynk)));
    const noches = fechas.map((f, i) => resumirNoche(f, crudas[i]));
    const conDatos = noches.filter(n => n.hay);

    if (conDatos.length < NOCHES_MINIMAS) {
      document.getElementById("cargando").innerHTML =
        `Sólo se encontraron ${conDatos.length} noches con registro en este periodo.<br>` +
        `Se necesitan al menos ${NOCHES_MINIMAS} para construir el reporte.`;
      return;
    }

    const indices = conDatos.map(n => n.indice);
    const eventosTotales = conDatos.reduce((a, n) => a + n.eventos, 0);
    const horasTotales = conDatos.reduce((a, n) => a + n.horas, 0);
    const conMax = conDatos.filter(n => n.maxima !== null);
    const conLargos = conDatos.filter(n => n.largos !== null);

    armar({
      noches, conRegistro: conDatos.length,
      indicePromedio: indices.reduce((a, b) => a + b, 0) / indices.length,
      indiceMin: Math.min(...indices),
      indiceMax: Math.max(...indices),
      horasTotales,
      duracionPromedio: conDatos.reduce((a, n) => a + n.duracion * n.eventos, 0) / eventosTotales,
      eventosTotales,
      maximaPeriodo: conMax.length ? Math.max(...conMax.map(n => n.maxima)) : null,
      largosTotales: conLargos.length ? conLargos.reduce((a, n) => a + n.largos, 0) : null,
      gradoPromedio: clasificar(indices.reduce((a, b) => a + b, 0) / indices.length),
      reparto: repartoPeriodo(noches),
    });
  })();
</script>
</body>
</html>
