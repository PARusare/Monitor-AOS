<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monitor AOS</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, sans-serif;
    background: #0d0f14;
    color: #eee;
    padding: 24px 16px 60px;
  }
  .top { display: flex; align-items: center; margin-bottom: 20px; }
  .volver { color: #999; text-decoration: none; font-size: 15px; margin-right: 12px; }
  h1 { font-size: 18px; font-weight: 600; color: #fff; }
  .card {
    background: #171a21;
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 16px;
  }

  .gauge-wrap { display: flex; flex-direction: column; align-items: center; }
  .gauge-svg-wrap { position: relative; width: 180px; height: 180px; }
  .gauge-svg-wrap svg { position: absolute; top: 0; left: 0; }
  .gauge-center {
    position: absolute; top: 0; left: 0; width: 180px; height: 180px;
    display: flex; align-items: center; justify-content: center;
  }
  .gauge-value { font-size: 56px; font-weight: 800; }
  .gauge-label { font-size: 13px; color: #999; margin-top: 10px; }
  .gauge-clasif { font-size: 16px; font-weight: 600; margin-top: 6px; padding: 4px 14px; border-radius: 20px; }

  .bar-row { margin-bottom: 16px; }
  .bar-row:last-child { margin-bottom: 0; }
  .bar-head { display: flex; justify-content: space-between; font-size: 13px; color: #ccc; margin-bottom: 6px; }
  .bar-track { background: #262a33; border-radius: 8px; height: 14px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 8px; transition: width 0.6s ease; }
  .bar-plain { font-size: 22px; font-weight: 700; }

  .hora-row { display: flex; align-items: center; margin-bottom: 6px; font-size: 12px; }
  .hora-label { width: 42px; color: #999; flex-shrink: 0; }
  .hora-track { flex: 1; background: #262a33; border-radius: 6px; height: 18px; overflow: hidden; margin: 0 8px; }
  .hora-fill { height: 100%; background: #3b82f6; border-radius: 6px; transition: width 0.6s ease; }
  .hora-num { width: 20px; text-align: right; color: #ccc; }

  .section-title { font-size: 14px; font-weight: 600; color: #999; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 14px; }
  #estado { text-align: center; color: #777; font-size: 13px; margin-top: 10px; }

  #btnGuardar {
    width: 100%;
    background: #22c55e;
    color: #06210f;
    font-size: 17px;
    font-weight: 700;
    border: none;
    border-radius: 14px;
    padding: 18px;
    margin-top: 8px;
  }
  #btnGuardar:disabled { background: #262a33; color: #666; }
  .texto-guardar { text-align: center; font-size: 12px; color: #777; margin-top: 10px; }

  .aviso-pasado {
    text-align: center;
    background: #262a33;
    color: #999;
    font-size: 13px;
    border-radius: 14px;
    padding: 16px;
    margin-top: 8px;
  }
</style>
</head>
<body>

  <div class="top">
    <a href="index.html" class="volver">&larr;</a>
    <h1 id="tituloFecha">Cargando...</h1>
  </div>

  <div class="card gauge-wrap">
    <div class="gauge-svg-wrap">
      <svg width="180" height="180" viewBox="0 0 180 180">
        <circle cx="90" cy="90" r="78" fill="none" stroke="#262a33" stroke-width="14"/>
        <circle id="gaugeArc" cx="90" cy="90" r="78" fill="none" stroke="#22c55e" stroke-width="14"
                stroke-linecap="round" transform="rotate(-90 90 90)"
                stroke-dasharray="490" stroke-dashoffset="0"/>
      </svg>
      <div class="gauge-center">
        <div class="gauge-value" id="valIndice">--</div>
      </div>
    </div>
    <div class="gauge-label">Indice de apnea (eventos/hora)</div>
    <div class="gauge-clasif" id="valClasif">--</div>
  </div>

  <div class="card">
    <div class="bar-row">
      <div class="bar-head"><span>Horas dormidas</span><span id="valHoras">--</span></div>
      <div class="bar-track"><div class="bar-fill" id="barHoras"></div></div>
    </div>
    <div class="bar-row">
      <div class="bar-head"><span>Duracion promedio de apnea</span><span id="valDuracion">--</span></div>
      <div class="bar-track"><div class="bar-fill" id="barDuracion"></div></div>
    </div>
    <div class="bar-row">
      <div class="bar-head"><span>Apneas totales</span><span id="valTotales">--</span></div>
      <div class="bar-track"><div class="bar-fill" id="barTotales"></div></div>
    </div>
    <div class="bar-row">
      <div class="bar-head"><span>Hora pico</span></div>
      <div class="bar-plain" id="valHoraPico">--</div>
    </div>
  </div>

  <div class="card">
    <div class="section-title">Apneas por hora</div>
    <div id="graficaHoras"></div>
  </div>

  <div id="zonaGuardar"></div>

  <div id="estado"></div>

<script>
  const TOKEN = "Y1l8ur86hHTcYlxXcNSJxuVsJEt1VsUO";
  const SERVIDOR = "ny3.blynk.cloud";
  const GH_USUARIO = "PARusare";
  const GH_REPO = "Monitor-AOS";
  const GH_TOKEN = "PON_AQUI_TU_TOKEN_DE_GITHUB";

  const params = new URLSearchParams(window.location.search);
  const fecha = params.get("fecha");

  function hoyMexico() {
    const partes = new Intl.DateTimeFormat("en-CA", {
      timeZone: "America/Mexico_City", year: "numeric", month: "2-digit", day: "2-digit"
    }).formatToParts(new Date());
    const obj = {};
    partes.forEach(p => obj[p.type] = p.value);
    return `${obj.year}-${obj.month}-${obj.day}`;
  }

  function formatearFecha(fechaISO) {
    if (!fechaISO || !fechaISO.includes("-")) return fechaISO || "Dia";
    const [anio, mes, dia] = fechaISO.split("-");
    const fechaObj = new Date(`${fechaISO}T12:00:00`); // mediodia, evita saltos de zona horaria
    const dias = ["DOMINGO","LUNES","MARTES","MIERCOLES","JUEVES","VIERNES","SABADO"];
    const nombreDia = dias[fechaObj.getDay()];
    const aa = anio.slice(2);
    return `${nombreDia} ${dia}/${mes}/${aa}`;
  }

  function colorSegunIndice(indice) {
    if (indice < 5)  return "#22c55e";
    if (indice < 15) return "#eab308";
    if (indice < 30) return "#f97316";
    return "#ef4444";
  }
  function textoClasificacion(codigo) {
    return ["Normal", "Leve", "Moderada", "Severa"][codigo] ?? "--";
  }

  function pintarGauge(indice) {
    const CIRCUNFERENCIA = 490;
    const llenado = Math.max(0.04, Math.min(1, 1 - (indice / 40)));
    const offset = CIRCUNFERENCIA * (1 - llenado);
    const color = colorSegunIndice(indice);
    const arc = document.getElementById("gaugeArc");
    arc.style.stroke = color;
    arc.style.strokeDashoffset = offset;
    document.getElementById("valIndice").innerText = indice.toFixed(1);
    document.getElementById("valIndice").style.color = color;
  }

  function pintarBarra(idBarra, valor, max, normal) {
    const pct = Math.max(0, Math.min(1, valor / max));
    const pctVisual = normal ? pct : (1 - pct);
    const color = pctVisual > 0.66 ? "#22c55e" : pctVisual > 0.33 ? "#eab308" : "#ef4444";
    const el = document.getElementById(idBarra);
    el.style.width = (pctVisual * 100) + "%";
    el.style.background = color;
  }

  function pintarGraficaHoras(textoConteo, indice) {
    const contenedor = document.getElementById("graficaHoras");
    contenedor.innerHTML = "";
    if (!textoConteo) {
      contenedor.innerHTML = '<div style="color:#666; font-size:13px;">Aun no hay eventos registrados.</div>';
      document.getElementById("valTotales").innerText = "0";
      pintarBarra("barTotales", 0, 30, false);
      document.getElementById("barTotales").style.background = colorSegunIndice(indice);
      return;
    }
    const valores = textoConteo.split("-").map(n => parseInt(n) || 0);
    const maxValor = Math.max(1, ...valores);
    let totalEventos = 0;
    valores.forEach((cantidad, hora) => {
      totalEventos += cantidad;
      if (cantidad === 0) return;
      const pct = (cantidad / maxValor) * 100;
      const fila = document.createElement("div");
      fila.className = "hora-row";
      const horaTexto = String(hora).padStart(2, "0");
      fila.innerHTML = `
        <div class="hora-label">${horaTexto}:00</div>
        <div class="hora-track"><div class="hora-fill" style="width:${pct}%"></div></div>
        <div class="hora-num">${cantidad}</div>`;
      contenedor.appendChild(fila);
    });
    if (totalEventos === 0) {
      contenedor.innerHTML = '<div style="color:#666; font-size:13px;">Aun no hay eventos registrados.</div>';
    }
    document.getElementById("valTotales").innerText = totalEventos;
    // El llenado (ancho) sigue siendo proporcional al total, pero el color
    // se toma de la misma clasificacion AASM que ya calculamos para el
    // indice -- asi esta barra siempre es consistente con el resto.
    pintarBarra("barTotales", totalEventos, 30, false);
    document.getElementById("barTotales").style.background = colorSegunIndice(indice);
  }

  function pintarTodo(datos) {
    const horas = parseFloat(datos.v4 ?? 0);
    const duracionProm = parseFloat(datos.v5 ?? 0);
    const indice = parseFloat(datos.v6 ?? 0);
    const horaPico = parseInt(datos.v7 ?? 0);
    const clasif = parseInt(datos.v8 ?? 0);
    const textoConteo = datos.v9 ?? "";

    pintarGauge(indice);
    document.getElementById("valClasif").innerText = textoClasificacion(clasif);
    document.getElementById("valClasif").style.background = colorSegunIndice(indice) + "33";
    document.getElementById("valClasif").style.color = colorSegunIndice(indice);
    document.getElementById("valHoras").innerText = horas.toFixed(2) + " h";
    pintarBarra("barHoras", horas, 9, true);
    document.getElementById("valDuracion").innerText = duracionProm.toFixed(1) + " s";
    pintarBarra("barDuracion", duracionProm, 40, false);
    document.getElementById("valHoraPico").innerText = horaPico + ":00 h";
    pintarGraficaHoras(textoConteo, indice);
  }

  // --- Guardar (solo disponible para el dia de hoy) ---
  async function guardarDatos(datos) {
    const boton = document.getElementById("btnGuardar");
    boton.disabled = true;
    boton.innerText = "Guardando...";
    const contenido = JSON.stringify(datos, null, 2);
    const contenidoB64 = btoa(unescape(encodeURIComponent(contenido)));
    try {
      const url = `https://api.github.com/repos/${GH_USUARIO}/${GH_REPO}/contents/reportes/${fecha}.json`;
      // Si ya existe un archivo de hoy, GitHub exige mandar su "sha" para poder reemplazarlo
      let sha = null;
      const existente = await fetch(url);
      if (existente.ok) sha = (await existente.json()).sha;

      const resp = await fetch(url, {
        method: "PUT",
        headers: { "Authorization": `token ${GH_TOKEN}`, "Content-Type": "application/json" },
        body: JSON.stringify({ message: "Reporte " + fecha, content: contenidoB64, sha })
      });
      if (!resp.ok) throw new Error("codigo " + resp.status);
      boton.innerText = "Guardado ✓";
    } catch (err) {
      boton.innerText = "Error al guardar";
      boton.disabled = false;
      console.error(err);
    }
  }

  (async () => {
    document.getElementById("tituloFecha").innerText = "Cargando...";

    try {
      // Primero se revisa Blynk: si su ultimo dato (V10) es justo el dia
      // solicitado, se usan esos datos en vivo (y se puede guardar).
      // Si no, se busca el reporte ya guardado en GitHub para ese dia.
      const respBlynk = await fetch(`https://${SERVIDOR}/external/api/getAll?token=${TOKEN}`);
      const datosBlynk = respBlynk.ok ? await respBlynk.json() : null;
      const esDatoActual = datosBlynk && datosBlynk.v10 === fecha;

      let datos;
      if (esDatoActual) {
        datos = datosBlynk;

        const zona = document.getElementById("zonaGuardar");
        const horas = parseFloat(datos.v4 ?? 0);
        zona.innerHTML = `<button id="btnGuardar" ${horas > 0 ? "" : "disabled"}>Guardar datos</button>
                           <div class="texto-guardar">Guardar datos para generar reporte semanal</div>`;
        document.getElementById("btnGuardar").onclick = () => guardarDatos(datos);
      } else {
        const resp = await fetch(`https://raw.githubusercontent.com/${GH_USUARIO}/${GH_REPO}/main/reportes/${fecha}.json`);
        if (!resp.ok) throw new Error("No se encontro un reporte guardado para este dia");
        datos = await resp.json();

        document.getElementById("zonaGuardar").innerHTML =
          '<div class="aviso-pasado">Este es un reporte guardado. No se puede sobreescribir.</div>';
      }

      pintarTodo(datos);
      document.getElementById("tituloFecha").innerText = formatearFecha(datos.v10);
      document.getElementById("estado").innerText = "Actualizado: " + new Date().toLocaleTimeString();
    } catch (err) {
      document.getElementById("estado").innerText = "Error: " + err.message;
    }
  })();
</script>
</body>
</html>
