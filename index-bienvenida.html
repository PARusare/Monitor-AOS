<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monitor AOS</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, sans-serif;
    background: #0d0f14;
    color: #eee;
    padding: 24px 16px 60px;
  }
  h1 { font-size: 22px; font-weight: 700; margin-bottom: 8px; color: #fff; }
  p.subtitulo { font-size: 14px; color: #999; margin-bottom: 28px; line-height: 1.4; }

  .menu-btn {
    width: 100%;
    background: #171a21;
    border: 1px solid #2a2e38;
    border-radius: 12px;
    padding: 16px;
    color: #eee;
    font-size: 16px;
    text-align: left;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .menu-btn .flecha { transition: transform 0.2s ease; color: #999; }
  .menu-btn.abierto .flecha { transform: rotate(180deg); }

  .menu-lista {
    display: none;
    background: #171a21;
    border: 1px solid #2a2e38;
    border-top: none;
    border-radius: 0 0 12px 12px;
    overflow: hidden;
  }
  .menu-lista.abierto { display: block; }
  .menu-lista a {
    display: flex;
    justify-content: space-between;
    padding: 14px 16px;
    color: #eee;
    text-decoration: none;
    font-size: 15px;
    border-top: 1px solid #2a2e38;
  }
  .menu-lista a:active { background: #21252f; }
  .menu-lista .etiqueta-hoy { color: #22c55e; font-size: 12px; font-weight: 600; }
  .menu-lista .vacio { padding: 16px; color: #666; font-size: 14px; }
</style>
</head>
<body>

  <h1>Monitor AOS</h1>
  <p class="subtitulo">Bienvenido al Monitor de tamizaje temprano de apnea del sueño. Selecciona un dia para ver su reporte.</p>

  <button class="menu-btn abierto" id="menuBtn" onclick="toggleMenu()">
    <span>Dias registrados</span>
    <span class="flecha">&#9660;</span>
  </button>
  <div class="menu-lista abierto" id="menuLista">
    <div class="vacio">Cargando...</div>
  </div>

<script>
  const GH_USUARIO = "PARusare";
  const GH_REPO = "Monitor-AOS";

  function toggleMenu() {
    document.getElementById("menuBtn").classList.toggle("abierto");
    document.getElementById("menuLista").classList.toggle("abierto");
  }

  function hoyMexico() {
    const partes = new Intl.DateTimeFormat("en-CA", {
      timeZone: "America/Mexico_City", year: "numeric", month: "2-digit", day: "2-digit"
    }).formatToParts(new Date());
    const obj = {};
    partes.forEach(p => obj[p.type] = p.value);
    return `${obj.year}-${obj.month}-${obj.day}`;
  }

  async function cargarListaDias() {
    const lista = document.getElementById("menuLista");
    const hoy = hoyMexico();

    let dias = [];
    try {
      const resp = await fetch(`https://api.github.com/repos/${GH_USUARIO}/${GH_REPO}/contents/reportes`);
      if (resp.ok) {
        const archivos = await resp.json();
        dias = archivos.map(a => a.name.replace(".json", "")).sort().reverse();
      }
    } catch (err) { /* seguimos aunque falle, abajo se agrega "hoy" de todas formas */ }

    // "Hoy" siempre aparece primero, aunque todavia no se haya guardado
    dias = dias.filter(d => d !== hoy);
    dias.unshift(hoy);

    lista.innerHTML = "";
    dias.forEach(fecha => {
      const a = document.createElement("a");
      a.href = `dia.html?fecha=${fecha}`;
      a.innerHTML = fecha === hoy
        ? `<span>${fecha}</span><span class="etiqueta-hoy">HOY</span>`
        : `<span>${fecha}</span>`;
      lista.appendChild(a);
    });
  }

  cargarListaDias();
</script>
</body>
</html>
